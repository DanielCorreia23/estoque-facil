
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Estoque Fácil</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f3f6f9; color: #253244; }
        header { background: #176b55; color: white; padding: 24px; }
        nav a { color: white; margin-right: 20px; }
        main { max-width: 850px; margin: 40px auto; padding: 25px; background: white; border-radius: 12px; }
        .botao { display: inline-block; background: #176b55; color: white; padding: 14px; margin: 8px; border-radius: 8px; text-decoration: none; }
        a:focus-visible { outline: 3px solid orange; outline-offset: 4px; }
    </style>
</head>
<body>
    <header>
        <h1>Estoque Fácil</h1>
        <nav aria-label="Navegação principal">
            <a href="/">Início</a>
            <a href="/produtos">Produtos</a>
            <a href="/lotes">Lotes</a>
            <a href="/validade">Validades</a>
        </nav>
    </header>
    <main>
        <h2>Controle de estoque e validade</h2>
        <p>Organize seus produtos, registre lotes e acompanhe as datas de vencimento.</p>
        <a class="botao" href="/produtos">Cadastrar produto</a>
        <a class="botao" href="/lotes">Cadastrar lote</a>
        <a class="botao" href="/validade">Consultar validades</a>
    </main>
</body>
</html>
